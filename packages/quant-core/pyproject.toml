[project]
name = "guiyi-quant-core"
version = "0.3.0"
description = "Authoritative indicator kernel for Guiyi Quant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy>=2.4.4,<3", "TA-Lib==0.8.3.post1"]

[dependency-groups]
test = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guiyi_quant"]

[tool.hatch.build.targets.sdist]
include = ["/guiyi_quant", "/tests", "/README.md", "/pyproject.toml"]
