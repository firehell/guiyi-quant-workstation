<section class="card" style="margin-top:16px" id="macdPanel">
<h2>2.2 · 30分钟 MACD 金死叉</h2>
<p>MACD 12/26/9；蓝线 DIF，橙线 DEA，柱值 2×(DIF−DEA)。相邻已完成K线的连线交点高度 h：<b>金叉 −5≤h≤5；高位死叉 h&gt;17</b>。这是独立条件，不代表完整开仓或减仓信号。</p>
<p class="muted">连线交点用于衡量高度，交叉到本根收盘后才确认，不把插值位置当作盘中时间。前根DIF≤DEA、本根DIF&gt;DEA为金叉；死叉反之。相等当根不触发，下一根严格分开时判断；相等后同侧离开也按此规则记录，待案例核对。</p>
<div><button id="prevCross">上一个交叉</button><button id="nextCross">下一个交叉</button></div>
<canvas id="macdChart"></canvas><pre id="macdFacts"></pre>
<details open><summary>当前物理合约的交叉列表（全窗口事后导航）</summary><p class="muted">下表包含所选时点之后的案例，仅用于导航，不参与当前时点计算。</p><table id="crossTable"></table></details>
<pre id="macdSource"></pre>
</section>
<script>
const crossNames={GOLDEN:'金叉',DEATH:'死叉',NONE:'无新交叉',UNKNOWN:'无法判断'};
function drawMacd(){
 const r=rows[index],m=r.macd;if(!m)return;
 $('macdFacts').textContent=`${r.contract} · 确认时点 ${r.label}\nDIF ${num(m.dif)}　DEA ${num(m.dea)}　柱 ${num(m.histogram)}\n${crossNames[m.cross]}　交点高度 ${num(m.height)}　线段比例 ${num(m.fraction)}\n零轴附近金叉：${m.near_zero_golden===null?'未知':m.near_zero_golden?'满足':'不满足'}　高位死叉：${m.high_death===null?'未知':m.high_death?'满足':'不满足'}${m.reason?'\n'+m.reason:''}`;
 const rs=rows.slice(Math.max(0,index-79),index+1),[g,w,h]=setup('macdChart');
 const values=rs.flatMap(r=>[r.macd.dif,r.macd.dea,r.macd.histogram]).filter(v=>v!==null).concat([-5,0,5,17]);
 let lo=Math.min(...values),hi=Math.max(...values),pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;
 const y=v=>h-30-(v-lo)/(hi-lo)*(h-55),dx=(w-75)/rs.length,x=i=>12+(i+.5)*dx;
 g.clearRect(0,0,w,h);g.font='11px system-ui';
 for(const v of [-5,0,5,17]){g.setLineDash(v===0?[]:[5,5]);g.strokeStyle='#adb6c3';g.beginPath();g.moveTo(8,y(v));g.lineTo(w-60,y(v));g.stroke();g.fillStyle='#667';g.fillText(String(v),w-55,y(v)+4)}g.setLineDash([]);
 rs.forEach((r,i)=>{let v=r.macd.histogram;if(v===null)return;g.fillStyle=v>=0?'#e8525260':'#22a46c60';g.fillRect(x(i)-dx*.3,Math.min(y(v),y(0)),Math.max(1,dx*.6),Math.max(1,Math.abs(y(v)-y(0))))});
 for(const [key,color] of [['dif','#4167cb'],['dea','#e6a02c']]){g.strokeStyle=color;g.lineWidth=2;g.beginPath();let active=false;rs.forEach((r,i)=>{let v=r.macd[key];if(v===null){active=false;return}if(active)g.lineTo(x(i),y(v));else g.moveTo(x(i),y(v));active=true});g.stroke()}g.lineWidth=1;
 rs.forEach((r,i)=>{const m=r.macd;if(m.height===null)return;g.fillStyle=m.cross==='GOLDEN'?'#c33':'#198754';g.beginPath();g.arc(x(i),y(m.height),4,0,2*Math.PI);g.fill();g.fillText(m.cross==='GOLDEN'?'金':'死',x(i)+4,y(m.height)-6)});
 g.fillStyle='#667';g.fillText(rs[0].label,10,h-8);g.fillText(rs.at(-1).label,Math.max(10,w-190),h-8);
 $('crossTable').replaceChildren();const head=document.createElement('tr');for(const v of ['确认时点','类型','交点高度','独立条件','定位']){const th=document.createElement('th');th.textContent=v;head.append(th)}$('crossTable').append(head);
 rows.forEach((r,i)=>{const m=r.macd;if(!['GOLDEN','DEATH'].includes(m.cross))return;const tr=document.createElement('tr');if(i===index)tr.style.background='#eaf0ff';for(const v of [r.label,crossNames[m.cross],num(m.height),m.near_zero_golden?'零轴附近金叉':m.high_death?'高位死叉':'未达到条件']){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td'),b=document.createElement('button');b.textContent='查看';b.onclick=()=>{index=i;draw()};td.append(b);tr.append(td);$('crossTable').append(tr)});
 $('prevCross').disabled=!rows.some((r,i)=>i<index&&r.macd.height!==null);$('nextCross').disabled=!rows.some((r,i)=>i>index&&r.macd.height!==null);
}
function moveCross(direction){for(let i=index+direction;i>=0&&i<rows.length;i+=direction){if(rows[i].macd.height!==null){index=i;draw();return}}}
$('prevCross').onclick=()=>moveCross(-1);$('nextCross').onclick=()=>moveCross(1);
$('macdSource').textContent=`因子版本 ${D.macd_version}\nMACD采用SMA种子、共享指标6位精度，使用完整同物理合约预热。已有截图MACD逐值一致性待核对。`;
drawMacd();
</script>
