name: Bug
description: Report a reproducible workstation, data, web, or runtime defect.
title: "[Bug]: "
labels:
  - type/bug
  - status/draft
body:
  - type: markdown
    attributes:
      value: |
        Use this for defects only. Do not include secrets, account credentials, webhook URLs, cookies, or tokens.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: One short, observable defect statement.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - area/workstation
        - area/data
        - area/web
        - area/indicator
        - area/runtime
    validations:
      required: true
  - type: dropdown
    id: risk_level
    attributes:
      label: Risk level
      options:
        - R3
        - R2
        - R1
        - R0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact command, page, task, or data slice that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link logs, screenshots, `.ai/results`, or test output. Do not paste secrets.
    validations:
      required: false
