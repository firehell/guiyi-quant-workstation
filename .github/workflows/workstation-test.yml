name: workstation-test

on:
  push:
    paths:
      - "scripts/ai/**"
      - "scripts/env/**"
      - "tests/workstation/**"
      - "configs/ai/**"
      - "Makefile"
      - ".github/workflows/workstation-test.yml"
  pull_request:
    paths:
      - "scripts/ai/**"
      - "scripts/env/**"
      - "tests/workstation/**"
      - "configs/ai/**"
      - "Makefile"
      - ".github/workflows/workstation-test.yml"

jobs:
  workstation-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Workstation doctor
        run: make workstation-doctor
      - name: Workstation pytest
        run: python3 -m pytest -q tests/workstation
