<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>盘整何时确认 · 4个片段</title>
<style>body{font:16px system-ui;color:#20334b;background:#f4f6fa;margin:0}main{max-width:1060px;margin:30px auto;padding:20px}.card{background:white;padding:24px;border:1px solid #dbe3ed;border-radius:12px;margin:18px 0}p{line-height:1.7}button{padding:12px 18px;margin:5px;border:1px solid #b7c5d8;border-radius:8px;background:white;color:#20334b;font:inherit;cursor:pointer}button:disabled{opacity:.4}canvas{width:100%;height:380px}small{color:#687991}#message{color:#9b5305}button.primary{background:#244a73;color:white}</style>
<main><h1>从哪一根开始，盘整已经确认？</h1><p>只复核4个以前看过的片段。先显示40根背景，之后每次选择当前状态并增加1根，直到64根（每段25次）。中途可能先震荡、再趋势、再震荡，因此不会在首次选择震荡时结束。判断的是“此时是否已经震荡”，不是预测下一步。紫线是EMA21辅助线。</p><p>这些都是已见开发案例，用来补清判断边界，不作为未见测试。第40根就已震荡，可以直接选择；它只表示“至迟此时已确认”，不会假定转变恰好发生在第40根。</p>
<section class="card"><strong id="title"></strong><p id="progress"></p><canvas id="chart"></canvas><p id="hint"></p><div id="choices"><button data-choice="not_yet">当前仍有方向／趋势</button><button data-choice="range" class="primary">当前已是震荡</button><button data-choice="uncertain">此时不确定</button></div><button id="previous">上一片段</button><button id="next">下一片段</button><button id="reset">重做本片段</button></section>
<section class="card"><button id="export" class="primary">导出这4段的判断</button><label>恢复文件 <input type="file" id="import" accept="application/json"></label><p>答案仅保存在本浏览器，不改原114份答案，不启动训练。每根可以改变判断，不强迫你与原分类一致；第40根的状态不能用于推断更早的转变时点。</p><p id="message"></p><small id="identity"></small></section></main>
<script>
const DATA=__DATA__, $=id=>document.getElementById(id), key='regime-boundary:'+DATA.dataset_id;let current=0,answers={};
const ids=new Set(DATA.samples.map(s=>s.id));
function valid(a){return a&&typeof a==='object'&&!Array.isArray(a)&&Object.entries(a).every(([id,es])=>ids.has(id)&&Array.isArray(es)&&es.length<=25&&es.every((e,i)=>e&&e.cut===40+i&&['not_yet','range','uncertain'].includes(e.choice)))}
try{const x=JSON.parse(localStorage.getItem(key)||'{}');if(valid(x))answers=x}catch{}
const done=es=>es.length===25;
function save(){try{localStorage.setItem(key,JSON.stringify(answers));$('message').textContent='已保存到本浏览器'}catch{$('message').textContent='保存不可用，请立即导出'}}
function draw(){const s=DATA.samples[current],events=answers[s.id]||[],finished=done(events),cut=finished?events.at(-1).cut:40+events.length,bars=s.bars.slice(0,cut);
$('title').textContent=`${s.symbol.toUpperCase()} · ${s.frequency} · ${s.contract} · 截至 ${bars.at(-1).time}`;
$('progress').textContent=`片段 ${current+1}/4 · 当前显示 ${cut} 根 · 已完成 ${Object.values(answers).filter(done).length}/4`;
$('hint').textContent=finished?'本段25个时点已记录，请继续下一片段。':'请选择此刻的状态，每次选择后展开下一根。无需预测之后走势；即使此刻震荡，后面也可以重新判趋势。';
$('choices').querySelectorAll('button').forEach(b=>b.disabled=finished);$('previous').disabled=current===0;$('next').disabled=current===3;
const canvas=$('chart'),ratio=devicePixelRatio||1,w=canvas.clientWidth,h=380;canvas.width=w*ratio;canvas.height=h*ratio;const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);const ema=s.ema21.slice(0,cut),finite=ema.filter(v=>v!==null),lo=Math.min(...bars.map(b=>b.low),...finite),hi=Math.max(...bars.map(b=>b.high),...finite),pad=Math.max((hi-lo)*.08,hi*.001),min=lo-pad,max=hi+pad,y=v=>20+(max-v)/(max-min)*(h-65),dx=(w-80)/64;
ctx.font='11px system-ui';for(let i=0;i<5;i++){const v=min+(max-min)*i/4,py=y(v);ctx.strokeStyle='#edf0f5';ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(w-65,py);ctx.stroke();ctx.fillStyle='#687991';ctx.fillText(v.toFixed(2),w-60,py+4)}
bars.forEach((b,i)=>{const x=10+(i+.5)*dx;ctx.strokeStyle=ctx.fillStyle=b.close>=b.open?'#d85d58':'#359978';ctx.beginPath();ctx.moveTo(x,y(b.high));ctx.lineTo(x,y(b.low));ctx.stroke();ctx.fillRect(x-dx*.3,Math.min(y(b.open),y(b.close)),Math.max(1,dx*.6),Math.max(1,Math.abs(y(b.open)-y(b.close))));if((i+1)%10===0){ctx.fillStyle='#687991';ctx.fillText(String(i+1),x-5,h-15)}});
ctx.strokeStyle='#7956b5';ctx.beginPath();let started=false;ema.forEach((v,i)=>{if(v===null){started=false;return}const x=10+(i+.5)*dx;if(started)ctx.lineTo(x,y(v));else ctx.moveTo(x,y(v));started=true});ctx.stroke();}
$('choices').onclick=e=>{const choice=e.target.dataset.choice;if(!choice)return;const id=DATA.samples[current].id,es=answers[id]||[];if(done(es))return;answers[id]=[...es,{cut:40+es.length,choice}];save();draw()};
$('previous').onclick=()=>{current--;draw()};$('next').onclick=()=>{current++;draw()};$('reset').onclick=()=>{delete answers[DATA.samples[current].id];save();draw()};
$('export').onclick=()=>{const payload={dataset_id:DATA.dataset_id,label_version:DATA.label_version,answers};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='regime-boundary-'+DATA.dataset_id.slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onchange=async e=>{try{const f=e.target.files[0];if(!f||f.size>1000000)throw Error();const p=JSON.parse(await f.text());if(p.dataset_id!==DATA.dataset_id||p.label_version!==DATA.label_version||!valid(p.answers))throw Error();answers=p.answers;save();draw();$('message').textContent='已恢复'}catch{$('message').textContent='文件无效或身份不匹配，未更改答案'}};
$('identity').textContent=DATA.dataset_id;window.addEventListener('resize',draw);draw();
</script></html>
