<script>    var CDT_ROLE_PERIOD = { week: { dir: 'week', exec: 'day' }, day: { dir: 'day', exec: '60min' } };

    function resolvePeriodChainBucket() {

    function cdtBucket3(rawStatus) {
      return rawStatus === 'holding' ? 'up' : (rawStatus === 'cleared' ? 'down' : 'neutral');

    function cdtDecide(D, X) {
      var d = cdtBucket3(D), x = cdtBucket3(X);
      if (d === 'neutral') { return { row: 'N', action: '等待', strength: 'tip', conflict: false }; }
      if (d === 'down' && x === 'down') { return { row: 'DD', action: '空仓', strength: 'violate', conflict: false }; }
      if (d === 'down' && x === 'up') { return { row: 'DU', action: '减仓', strength: 'tip', conflict: false }; }
      if (d === 'down' && x === 'neutral') { return { row: 'DN', action: '空仓', strength: 'tip', conflict: false }; }
      if (d === 'up' && x === 'down') { return { row: 'UD', action: '等待', strength: 'tip', conflict: true }; }
      if (d === 'up' && x === 'neutral') { return { row: 'UN', action: '等待', strength: 'tip', conflict: false }; }
      return { row: 'UU', action: '建仓', strength: 'ok', conflict: false };
    }
    function cdtTriggerText(row, dirFull, execFull) {
      switch (row) {
        case 'DD': return dirFull + '与' + execFull + '同时清仓';
        case 'DU': return dirFull + '清仓、' + execFull + '建仓';
        case 'DN': return dirFull + '清仓、' + execFull + '未表态';
        case 'UD': return dirFull + '建仓、' + execFull + '清仓';
        case 'UN': return dirFull + '建仓、' + execFull + '未表态';
        case 'UU': return dirFull + '与' + execFull + '同时建仓';
        default: return dirFull + '未表态';
      }
    }

      try {
        var bucket = resolvePeriodChainBucket();
        if (!bucket) return null;

        if (!tf) return null;
        var b = (basis === 'day') ? 'day' : 'week';
        var rp = CDT_ROLE_PERIOD[b];
        var dirFull = CDT_PERIOD_FULL[rp.dir], execFull = CDT_PERIOD_FULL[rp.exec];
        var D = (tf[rp.dir] && tf[rp.dir].status) || 'idle';
        var X = (tf[rp.exec] && tf[rp.exec].status) || 'idle';
        var dec = cdtDecide(D, X);
        dec.basis = b; dec.dir = rp.dir; dec.exec = rp.exec; dec.dirFull = dirFull; dec.execFull = execFull;
        dec.strengthLevel = dec.strength;
        dec.strengthName = CDT_STRENGTH_LABEL[dec.strength];
        dec.strengthText = cdtTriggerText(dec.row, dirFull, execFull);
        dec.reason = CDT_REASON[dec.row];
        return dec;
      } catch (e) { return null; }
    }
    function cdtActionColor(action) {

      const tf = (window._strategyTfSignals && window._strategyTfSignals[bucket]) || {};

          _mk('day', '日线', '主 · 定方向', true, false, day),

          _mk('week', '周线', '参考', false, true, week)
        ];
      }
      return [
        _mk('week', '周线', '主 · 定方向', true, false, week),
        _mk('day', '日线', '从 · 定执行', false, false, day),
        _mk('60min', '60分', '择时', false, true, m60)
      ];
    }
    function resolvePeriodConflictHit(bucket, tf) {
      if (!bucket) return false;
      tf = tf || ((window._strategyTfSignals && window._strategyTfSignals[bucket]) || {});
      const week = (tf.week && tf.week.status) || 'idle';
      const day = (tf.day && tf.day.status) || 'idle';
      if (bucket === 'huanglantai') {
        const cd = window.__compositeDecision;
        if (cd && cd.periodConflict && typeof cd.periodConflict.hit === 'boolean') return cd.periodConflict.hit;

      }

    function renderCompositeChain() {
