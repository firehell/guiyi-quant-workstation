name: engineering-test

on:
  push:
    paths:
      - "scripts/engineering/**"
      - "tests/engineering/**"
      - ".codex/**"
      - "Makefile"
      - ".github/workflows/engineering-test.yml"
      - ".github/workflows/lane-pr-gate.yml"
      - "AGENTS.md"
      - "DECISIONS.md"
      - "PROJECT_SOURCE.md"
      - "README.md"
      - "STATUS.md"
      - "TESTING.md"
      - "docs/WORKTREE_RELEASE_WORKFLOW.md"
      - "docs/decisions/ADR-WS-003-develop-release-worktree-lifecycle.md"
      - "docs/decisions/ADR-WS-004-five-layer-manual-pr.md"
  pull_request:
    paths:
      - "scripts/engineering/**"
      - "tests/engineering/**"
      - ".codex/**"
      - "Makefile"
      - ".github/workflows/engineering-test.yml"
      - ".github/workflows/lane-pr-gate.yml"
      - "AGENTS.md"
      - "DECISIONS.md"
      - "PROJECT_SOURCE.md"
      - "README.md"
      - "STATUS.md"
      - "TESTING.md"
      - "docs/WORKTREE_RELEASE_WORKFLOW.md"
      - "docs/decisions/ADR-WS-003-develop-release-worktree-lifecycle.md"
      - "docs/decisions/ADR-WS-004-five-layer-manual-pr.md"

jobs:
  engineering-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Engineering preflight (CI mode)
        run: make engineering-preflight ENGINEERING_PREFLIGHT_ARGS=--ci
      - name: Engineering test
        run: make engineering-test
      - name: Engineering secrets (fail-closed)
        run: make engineering-secrets
