# 归一量化 Web 反向代理（腾讯云 / 阿里云轻量服务器）
#
# 上游由 ./scripts/dev-up.sh 启动：
#   Web  -> 127.0.0.1:5173  (Vite dev)
#   API  -> 127.0.0.1:8000  (FastAPI)
#
# 安装说明见 deploy/nginx/README.md

server {
    listen 80;
    server_name _;

    # Basic Auth：密码文件勿提交仓库，在服务器上单独创建
    # sudo htpasswd -c /etc/nginx/.htpasswd-guiyi <user>
    auth_basic "Guiyi Quant";
    auth_basic_user_file /etc/nginx/.htpasswd-guiyi;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
