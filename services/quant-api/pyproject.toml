[project]
name = "quant-api"
version = "1.6.1"
description = "Local-first domestic futures market data and Runtime API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.138.0",
    "guiyi-quant-core",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "rqdatac==3.5.6.1",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.4.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.18",
]

[project.scripts]
guiyi = "app.guiyi_cli.main:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# RQData 3.5.2+ documents pandas 3 support, but its wheel metadata still caps pandas below 3.
override-dependencies = ["pandas>=3.0.3"]

[tool.uv.sources]
guiyi-quant-core = { path = "../../packages/quant-core", editable = true }
