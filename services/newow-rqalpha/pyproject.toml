[project]
name = "guiyi-newow-rqalpha-proof"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["rqalpha==6.3.0"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
pythonpath = ["."]
