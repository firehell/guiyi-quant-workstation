<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>苏冰 · 交易需求协作</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#233047;font:15px system-ui}main{max-width:1200px;margin:30px auto;padding:0 20px}h1{font-size:26px;margin-bottom:8px}.muted{color:#617087;line-height:1.7}header,section{background:white;border:1px solid #e1e7ef;border-radius:12px;padding:22px;margin-bottom:16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,select{padding:10px 15px;border:1px solid #d1dbea;border-radius:7px;background:white;color:#233047;cursor:pointer}button.active,.primary{background:#315ed3;color:white;border-color:#315ed3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}dl{display:grid;grid-template-columns:150px 1fr;gap:9px}dt{color:#617087}dd{margin:0}textarea{width:100%;height:100px;padding:12px;border:1px solid #ccd6e3;border-radius:8px;font:inherit;margin:12px 0}svg{width:100%;height:330px;background:#fbfcfe}.badge{display:inline-block;background:#eef3ff;padding:5px 10px;border-radius:5px;font-size:13px}label{display:block;margin:12px 0}footer{display:flex;gap:12px;align-items:center;flex-wrap:wrap}@media(max-width:750px){.grid{grid-template-columns:1fr}main{margin:12px auto}dl{grid-template-columns:125px 1fr}}
</style><main><header><h1>苏冰 · 交易需求协作</h1><div class="muted">第一批：6个真实历史模型场景＋2个明确标注的规则情境。只看当时已知信息，不展示未来或模型本次答案。历史模型仓位不是真实账户持仓。</div><details><summary>已确认规则（可查阅，不需要重新选择）</summary><p class="muted">首仓不增加v2门槛；30m震荡、反向或未知暂停加仓；恢复同向趋势后等严格后续的新回踩；退出优先。转震荡不自动清仓。清仓后等新交叉，不固定冷却、不自动反手。当前案例用于核对需求，不用于计算准确率或自动训练。</p></details><nav id="nav"></nav><div id="progress" class="muted"></div></header><section><span id="kind" class="badge"></span><h2 id="title"></h2><div id="time" class="muted"></div><svg id="chart" viewBox="0 0 1000 330" role="img" aria-label="截至案例时刻的30分钟K线与可用EMA21"></svg><div class="grid"><div id="position"></div><div id="facts"></div></div><p id="question"></p><p id="extra" class="muted"></p></section><section><label>你希望下一步怎么做？ <select id="action"></select></label><label>与现有规则的关系 <select id="stance"><option value="">请选择</option><option>沿用现有规则</option><option>希望调整规则</option><option>不确定／资料不足</option></select></label><textarea id="note" placeholder="一句话说明最关键的依据；若想减仓，请说明减哪层；若想改规则，请写出差异。"></textarea><div class="muted">本机自动暂存。未选择不会自动填答案；导出后请把文件交回，才会进入规则整理。</div><footer><button id="prev">上一例</button><button id="next">保存并下一例</button><button id="export" class="primary">导出本批判断</button><span id="saved" class="muted"></span></footer></section></main><script>
const data=__PAYLOAD__;const key=data.version+':'+data.dataset_id;let answers={},index=0;try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const $=id=>document.getElementById(id);const fmt=x=>x==null?'未知':Number(x).toFixed(2);const when=t=>t?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',dateStyle:'short',timeStyle:'short'}).format(new Date(t)):'无';const yn=x=>x===null||x===undefined?'未知':x?'满足':'不满足';const regimes={TREND_UP:'上涨',TREND_DOWN:'下跌',RANGE:'震荡',UNKNOWN:'未知',UP:'上涨',DOWN:'下跌',NEUTRAL:'中性'};
function line(parent,k,v){let dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;parent.append(dt,dd)}
function panel(id,title,rows){let box=$(id);box.replaceChildren();let h=document.createElement('h3');h.textContent=title;let dl=document.createElement('dl');rows.forEach(r=>line(dl,...r));box.append(h,dl)}
function svg(tag,attrs){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));$('chart').append(e);return e}
function draw(bars,stop){$('chart').replaceChildren();let values=bars.flatMap(b=>[b.high,b.low,...(b.ema==null?[]:[Number(b.ema)])]);if(stop!=null)values.push(Number(stop));let lo=Math.min(...values),hi=Math.max(...values),span=Math.max(hi-lo,1);lo-=span*.05;hi+=span*.05;const y=v=>290-(v-lo)/(hi-lo)*265,dx=900/bars.length;for(let i=0;i<5;i++){let v=lo+(hi-lo)*i/4;svg('line',{x1:55,x2:960,y1:y(v),y2:y(v),stroke:'#e4e9f1'});svg('text',{x:2,y:y(v)+4,'font-size':12,fill:'#66758c'}).textContent=v.toFixed(1)}let path='';bars.forEach((b,i)=>{let x=65+i*dx,c=b.close>=b.open?'#d54b53':'#21887a';svg('line',{x1:x,x2:x,y1:y(b.high),y2:y(b.low),stroke:c});svg('rect',{x:x-dx*.3,y:Math.min(y(b.open),y(b.close)),width:dx*.6,height:Math.max(1,Math.abs(y(b.close)-y(b.open))),fill:c});if(b.ema!=null)path+=(path?' L':'M')+x+' '+y(Number(b.ema));else if(path){svg('path',{d:path,fill:'none',stroke:'#c79c32','stroke-width':2});path=''}});if(path)svg('path',{d:path,fill:'none',stroke:'#c79c32','stroke-width':2});if(stop!=null){svg('line',{x1:55,x2:960,y1:y(stop),y2:y(stop),stroke:'#9b64b3','stroke-dasharray':'5 4'});svg('text',{x:700,y:y(stop)-5,'font-size':12,fill:'#9b64b3'}).textContent='原固定止损 '+fmt(stop)}svg('text',{x:55,y:320,'font-size':12,fill:'#66758c'}).textContent=when(bars[0].time);svg('text',{x:740,y:320,'font-size':12,fill:'#66758c'}).textContent=when(bars.at(-1).time)}
function save(){let c=data.cards[index];answers[c.id]={action:$('action').value,stance:$('stance').value,note:$('note').value};try{localStorage.setItem(key,JSON.stringify(answers));$('saved').textContent='已暂存'}catch{$('saved').textContent='暂存失败，请及时导出'}progress()}
function progress(){$('progress').textContent='已填写 '+data.cards.filter(c=>answers[c.id]?.action&&answers[c.id]?.stance).length+' / '+data.cards.length+'；可随时返回修改。'}
function render(){let c=data.cards[index];$('nav').replaceChildren();data.cards.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v.id;b.className=i===index?'active':'';b.onclick=()=>{save();index=i;render()};$('nav').append(b)});$('kind').textContent=c.kind==='HISTORICAL_MODEL'?'真实历史 · 离线模型仓位':'规则讨论 · 非真实行情事件';$('title').textContent=c.id+' · '+c.title;$('time').textContent=c.at?c.contract+' · '+when(c.at)+' 北京时间 · 仅展示至此的30m K线，金线EMA21（缺少时不补画）':'';$('question').textContent=c.question;$('extra').textContent=c.note||'';$('chart').style.display=c.bars?'block':'none';if(c.bars){draw(c.bars,c.position.initial_stop);let p=c.position,f=c.facts,m=f.m30;panel('position','当时的模型持仓',[['方向／手数',(p.side==='LONG'?'多头':p.side==='SHORT'?'空头':'空仓')+' / '+p.quantity],['持仓成本',p.layers.map(l=>(l.kind==='OPEN'?'底仓':'加仓')+' '+fmt(l.price)+' @ '+when(l.at)).join('；')||'无'],['当前持仓净浮盈',fmt(f.remaining_net)+' 元（扣开费及预计平费）'],['固定止损',fmt(p.initial_stop)],['原1R目标',fmt(p.profit_target)],['1R机会已消费',p.profit_taken?'是':'否'],['首仓量档',p.entry_volume_tier||'无'],['未决动作',p.pending?p.pending.kind:'无'],['上次清仓确认',when(p.last_flat_at)],['此前完成30m数（不含本根）',String(p.completed_m30)],['旧回踩资格',p.pullback?when(p.pullback.at)+' / '+fmt(p.pullback.level):'无'],['上次资格重置',when(p.reset_after)],['前一时点交叉窗口',Object.entries(p.entry_windows).map(([s,w])=>(s==='LONG'?'多':'空')+'：'+(w.source_end?when(w.source_end)+'，龄'+w.age:'无')).join('；')]]);panel('facts','当时可知条件',[['30m环境',regimes[m.regime]],['日线方向',regimes[f.daily_direction]+'，来源 '+when(f.daily_at)],['当前收盘 / EMA',fmt(f.close)+' / '+fmt(m.ema21)],['分钟角度',fmt(m.minute_angle)+'°'],['近轴金叉 / 死叉',yn(m.near_zero_golden)+' / '+yn(m.near_zero_death)],['当根放量',yn(m.volume_effective)],['新回踩 / 反弹',yn(m.qualified_pullback)+' / '+yn(m.qualified_rebound)],['跌破 / 站上EMA',yn(m.below_ema)+' / '+yn(m.above_ema)],['破前低 / 前高',yn(m.below_previous_low)+' / '+yn(m.above_previous_high)],['高位死叉 / 低位金叉',yn(m.high_death)+' / '+yn(m.low_golden)],['日终禁新增区间',yn(f.day_end_window)],['风险准入',yn(f.admission)]]);}else{$('position').replaceChildren();$('facts').replaceChildren()}$('action').replaceChildren();['',...(c.options||['等待，不新增','首仓机会，检查执行资格','持有，暂停加仓','持有，等待新回踩或突破','申请加仓','申请减仓','申请全清','不确定／资料不足'])].forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v||'请选择';$('action').append(o)});let a=answers[c.id]||{};$('action').value=a.action||'';$('stance').value=a.stance||'';$('note').value=a.note||'';$('saved').textContent='';progress()}
$('action').onchange=save;$('stance').onchange=save;$('note').oninput=save;$('prev').onclick=()=>{save();index=Math.max(0,index-1);render()};$('next').onclick=()=>{save();index=Math.min(data.cards.length-1,index+1);render()};$('export').onclick=()=>{save();let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({version:data.version,dataset_id:data.dataset_id,exported_at:new Date().toISOString(),answers},null,2)],{type:'application/json'}));a.href=url;a.download='苏冰交易需求判断-'+data.dataset_id.slice(0,8)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></html>
