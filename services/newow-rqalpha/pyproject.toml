[project]
name = "guiyi-newow-rqalpha-proof"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["guiyi-quant-core==0.4.0", "rqalpha==6.3.0"]

[tool.uv.sources]
guiyi-quant-core = { path = "../../packages/quant-core", editable = true }

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
pythonpath = ["."]
