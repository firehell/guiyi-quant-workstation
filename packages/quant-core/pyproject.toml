[project]
name = "guiyi-quant-core"
version = "0.1.0"
description = "Authoritative indicator kernel for Guiyi Quant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy>=2.4.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guiyi_quant"]
